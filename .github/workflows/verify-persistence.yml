name: Verify GitHub persistence
on:
  push:
    paths:
      - "docs/predictions/v2/**"
      - "docs/predictions/index-v2.json"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: python scripts/verify_github_persistence.py --repository "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"
