name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: python -m py_compile src/screen.py src/integrity.py src/analysis_pipeline.py src/analysis_runtime.py src/ai_analysis.py src/records.py src/entry_resolution.py src/verification.py src/github_persistence.py src/write_request.py scripts/check_status.py scripts/validate_analysis_contracts.py scripts/process_analysis_request.py scripts/validate_v2_records.py scripts/persist_v2_record.py scripts/resolve_pending_entries.py scripts/generate_verifications.py scripts/verify_github_persistence.py scripts/process_gpt_write_request.py

      - name: Validate JSON schema syntax
        run: python -c "import json,pathlib,yaml; [json.loads(p.read_text()) for p in pathlib.Path('schemas').rglob('*.json')]; [yaml.safe_load(p.read_text()) for p in pathlib.Path('openapi').glob('*.yaml')]; [yaml.safe_load(p.read_text()) for p in pathlib.Path('.github/workflows').glob('*.yml')]"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate immutable schema 2.0 bundles
        run: python scripts/validate_v2_records.py

      - name: Run schema 2.0 fixture E2E
        run: python -m unittest tests.test_v2_e2e -v

      - name: Validate analysis contracts and publication round-trip
        run: python scripts/validate_analysis_contracts.py

      - name: Ruff lint and formatter check
        run: ruff check src/ai_analysis.py src/analysis_runtime.py scripts/process_analysis_request.py scripts/validate_analysis_contracts.py tests/test_ai_analysis.py tests/test_analysis_runtime_e2e.py && ruff format --check src/ai_analysis.py src/analysis_runtime.py scripts/process_analysis_request.py scripts/validate_analysis_contracts.py tests/test_ai_analysis.py tests/test_analysis_runtime_e2e.py

      - name: Mypy analysis runtime
        run: mypy src/ai_analysis.py src/analysis_runtime.py scripts/process_analysis_request.py scripts/validate_analysis_contracts.py

      - name: Package build and install smoke test
        run: python -m build && pip install --force-reinstall --no-deps dist/*.whl

      - name: Markdown structure and forbidden wording audit
        run: |
          python -c "from pathlib import Path; files=[Path('README.md'),Path('CHATGPT_PROMPT.md'),Path('docs/architecture-3.0.md')]; assert all(p.read_text().startswith('#') for p in files)"
          ! rg -n "AI (may|can) (change|override) (FACTS|MECHANICAL_SIGNALS|hard exclusion)" README.md CHATGPT_PROMPT.md docs/architecture-3.0.md

      - name: Git whitespace check
        run: git diff --check
