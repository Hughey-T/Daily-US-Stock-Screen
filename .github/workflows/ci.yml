name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile src/screen.py src/integrity.py src/analysis_pipeline.py scripts/check_status.py scripts/validate_v2_records.py

      - name: Validate JSON schema syntax
        run: python -c "import json,pathlib; [json.loads(p.read_text()) for p in pathlib.Path('schemas').glob('*.json')]"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate immutable schema 2.0 bundles
        run: python scripts/validate_v2_records.py
