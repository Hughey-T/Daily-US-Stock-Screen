name: Generate prediction verifications
on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: generate-verifications
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/generate_verifications.py
      - run: python scripts/validate_v2_records.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/verifications
          git diff --cached --quiet && exit 0
          git commit -m "Generate prediction verifications"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
