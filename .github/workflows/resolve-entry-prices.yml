name: Resolve next-session entry prices
on:
  schedule:
    # Weekdays after the regular US open; holiday runs remain pending/unavailable.
    - cron: "15 15 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: resolve-entry-prices
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/resolve_pending_entries.py
      - run: python scripts/validate_v2_records.py
      - name: Commit immutable entry resolution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/entry-resolutions
          git diff --cached --quiet && exit 0
          git commit -m "Resolve next-session entry prices"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
